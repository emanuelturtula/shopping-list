name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: server
        run: npm ci && npm test
      - name: Frontend tests
        working-directory: web
        run: npm ci && npm test
      - name: Frontend build
        working-directory: web
        run: npm run build
