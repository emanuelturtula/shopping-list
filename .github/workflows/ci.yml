name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backend tests
        working-directory: server
        run: npm ci && npm test
      - name: Frontend tests
        working-directory: web
        run: npm ci && npm test
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Deploy files are valid
        run: |
          shellcheck deploy/*.sh
          TUNNEL_TOKEN=x docker compose -f deploy/docker-compose.yml config -q

  # Builds the image for the Raspberry Pi (arm64) on every PR, and publishes it
  # on merges to master. The Pi picks it up within a minute (deploy/update.sh).
  image:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/emanuelturtula/shopping-list
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          mkdir -p data && sudo chown 1000:1000 data
          docker run -d --name smoke -p 8080:8080 -v "$PWD/data:/data" -e DEV_USER_EMAIL=ci@example.com "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/api/me | grep -q ci@example.com
          curl -fs -H 'content-type: application/json' -d '{"name":"Leche"}' http://127.0.0.1:8080/api/products | grep -q Leche
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'
          test -f data/shopping.db
          docker rm -f smoke
      - name: Publish
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
